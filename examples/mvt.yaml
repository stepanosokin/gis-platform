schema_version: 1
server: {host: localhost, port: 8080}
postgis_connections:
  live:
    host: postgis.example.org
    database: gis
    user: tiles_reader
    password_file: ./secrets/observations-password
sources:
  observations:
    type: postgis
    connection: live
    schema: gis
    relation: published_observations
    id_field: id
    geometry_field: geom
    max_lag_seconds: 0
providers:
  live-martin:
    type: martin
    image: ghcr.io/maplibre/martin:1.16.1@sha256:59902019bf9038926ff0c71174237d6852e64c457830a6349abe7090be8818ca
    api:
      protocol: mvt
      scheme: http
      port: 3000
      base_path: /
      public_root: /mvt
      links: canonical
      readiness: /health
publications:
  observations:
    source: observations
    provider: live-martin
    protocol: mvt
    access: public
    title: Observations
    description: Vector web tiles from PostGIS.
    extent: [37, 55, 40, 58]
    mvt_properties: [label]
    freshness: {max_delay_seconds: 0}
