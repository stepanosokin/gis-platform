name: gis-platform

services:
  caddy:
    image: caddy:2.10.2-alpine@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d
    ports:
      - target: ${GIS_CADDY_PORT:-80}
        published: "${GIS_PUBLIC_PORT:-8080}"
        host_ip: 127.0.0.1
    volumes:
      - type: bind
        source: ${GIS_REVISION_DIR:-./.gis-platform}/Caddyfile
        target: /etc/caddy/Caddyfile
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      pygeoapi:
        condition: service_healthy

  pygeoapi:
    image: geopython/pygeoapi:0.24.0@sha256:a62895f2585ef1fcd1fc97ec35bf13177becc1334a622172a2c5c4d2145b8f0a
    environment:
      PYGEOAPI_CONFIG: /etc/pygeoapi/config.yml
      WSGI_WORKERS: "1"
      GIS_PUBLICATION_ID: ${GIS_PUBLICATION_ID:-places}
    volumes:
      - type: bind
        source: ${GIS_REVISION_DIR:-./.gis-platform}/pygeoapi.yml
        target: /etc/pygeoapi/config.yml
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${GIS_SOURCE_FILE:-./examples/places.geojson}
        target: /source/data.geojson
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test:
        - CMD
        - /venv/bin/python
        - -c
        - |
          from os import environ
          from urllib.request import urlopen
          collection = 'http://127.0.0.1/collections/' + environ['GIS_PUBLICATION_ID']
          for path in ('?f=json', '/items?f=json&limit=1'):
              with urlopen(collection + path, timeout=2) as response:
                  response.read()
      interval: 2s
      timeout: 3s
      retries: 25
