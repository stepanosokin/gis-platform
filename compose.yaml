name: gis-platform

services:
  caddy:
    image: caddy:2.10.2-alpine@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d
    ports:
      - "${GIS_PUBLIC_BIND:+${GIS_PUBLIC_BIND:-}:}${GIS_PUBLIC_PORT:-80}:${GIS_CADDY_PORT:-80}"
    command: [caddy, run, --config, /etc/caddy/gis/Caddyfile, --adapter, caddyfile]
    volumes:
      - type: bind
        source: ${GIS_REVISION_DIR:-./.gis-platform}
        target: /etc/caddy/gis
        read_only: true
        bind:
          create_host_path: false
  pygeoapi:
    image: geopython/pygeoapi:0.24.0@sha256:a62895f2585ef1fcd1fc97ec35bf13177becc1334a622172a2c5c4d2145b8f0a
    environment:
      PYGEOAPI_CONFIG: /etc/pygeoapi/gis/pygeoapi.yml
      PYGEOAPI_OPENAPI: /etc/pygeoapi/gis/openapi.json
    entrypoint: [/venv/bin/gunicorn]
    command: [--workers, "1", --worker-class, gevent, --timeout, "6000", --bind, "0.0.0.0:80", "pygeoapi.flask_app:APP"]
    volumes:
      - type: bind
        source: ${GIS_PROVIDER_REVISION_DIR:-${GIS_REVISION_DIR:-./.gis-platform}}
        target: /etc/pygeoapi/gis
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${GIS_SOURCE_FILE:-./examples/places.geojson}
        target: /source/data.geojson
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test:
        - CMD
        - /venv/bin/python
        - -c
        - |
          from urllib.request import urlopen
          with urlopen('http://127.0.0.1/openapi?f=json', timeout=2) as response:
              response.read()
      interval: 2s
      timeout: 3s
      retries: 25
